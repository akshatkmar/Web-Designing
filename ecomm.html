<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Cave</title>
    <link rel="stylesheet" href="stylecomm.css">
</head>
<body>
    <nav>
        <div class="logo">👟 Sneakers Cave</div>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#" id="cart-btn">Cart (0)</a></li>
        </ul>
    </nav>

    <header>
        <h1>Fresh Drops for Campus Life</h1>
        <p>Built by students, for students. 10% off with .edu email!</p>
    </header>

    <main class="productgrid">
        <div class="card">
            <div class="badge">Best Seller</div>
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300" alt="Red Sneaker">
            <h3>Retro Red Lows</h3>
            <p class="price">Rs. 2999</p>
            <button onclick="addToCart()">Add to Bag</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=300" alt="Yellow Sneaker">
            <h3>Sunny Days Hi-Top</h3>
            <p class="price">$75.00</p>
            <button onclick="addToCart()">Add to Bag</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=300" alt="White Sneaker">
            <h3>Cloud Walker V2</h3>
            <p class="price">$120.00</p>
            <button onclick="addToCart()">Add to Bag</button>
        </div>
    </main>

    <footer>
        <p>© 2026 Web Dev Project - Created with ❤️</p>
    </footer>
</body>
</html>
