<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <h2><u>Student Registration Form</u></h2>
    <form method="post" action="/submit">
        <label>Full Name:</label>
        <input type="text" placeholder="John Doe" required><br><br>

        <label>Email:</label>
        <input type="email" placeholder="student@college.edu" required><br><br>

        <label>Phone:</label>
        <input type="tel" placeholder="9876543210" required><br><br>

        <label>Course:</label>
        <select required>
            <option value="">Select</option>
            <option>BCA</option>
            <option>B.Tech</option> </select><br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
