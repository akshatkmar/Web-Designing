<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        header{
            text-align: center;
        }
        .gallery{
            display:flex;
            margin: 15px;
        }
        .imagecontainer
        {
            background: #fff;
            border: 1px solid #e0e4ef;
            padding: 12px;
            width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .container{
            width: 100%;
            height: 200px;
            border: 2px solid black ;
            border-radius: 6px;
            cursor: pointer;
            margin: 20px;
            justify-content: center;
        }
        .container img{
            width: 100%;
            height: 150px;
            background-size: cover;
            border-radius: 6px;
        }
        .container h6{
            font-weight: 700;
            text-align: center;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Image Gallery</h1>
    </header>

    <div class="gallery">
        <section class="imagecontainer">
        <div class="container">
            <img src="dog1.jpg" alt="Dog img">
            <h6>Dog 1</h6>
        </div>

        <div class="container">
            <img src="dog2.jpg" alt="Dog img">
            <h6>Dog 2</h6>
        </div>

        <div class="container">
            <img src="dog3.jpg" alt="Dog img">
            <h6>Dog 3</h6>
        </div>

        <div class="container">
            <img src="dog4.jpg" alt="Dog img">
            <h6>Dog 4</h6>
        </div>

        <div class="container">
            <img src="dog5.jpg" alt="Dog img">
            <h6>Dog 5</h6>
        </div>

        <div class="container">
            <img src="dog6.jpg" alt="Dog img">
            <h6>Dog 6</h6>
        </div>
        </section>
    </div>
</body>
</html>
